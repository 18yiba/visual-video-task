name: Windows offline installer
on:
  push:
    branches: [master]
    paths:
      - 'packaging/version.txt'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      VIDEO_EEG_USER_DIR: '${{ github.workspace }}/.desktop-test-user'
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated laboratory runtime
        shell: powershell
        run: '& ./scripts/install_lab_env_uv.ps1'
      - name: Tests
        shell: powershell
        run: '& ./.venv/Scripts/python.exe -m pytest tests -q'
      - name: Install Inno Setup compiler
        shell: powershell
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/inno.exe"
          if ((Get-AuthenticodeSignature "$env:RUNNER_TEMP/inno.exe").Status -ne 'Valid') { throw 'Invalid compiler signature' }
          $proc = Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',"/DIR=$env:RUNNER_TEMP/InnoSetup" -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build standalone EXE installer and self-test
        shell: powershell
        run: '& ./.venv/Scripts/python.exe scripts/build_windows_release.py --iscc "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"'
      - name: Publish versioned release
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: powershell
        run: |
          $version = (Get-Content packaging/version.txt -Raw).Trim()
          gh release create "desktop-v$version" dist/VisualVideoTask-Setup-Windows-x64.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "视频EEG总范式 Windows 离线安装版 $version" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing assets were not overwritten' }
