name: Source entries and locked tooling
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --group test
      - name: Resolve Windows lab dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'pyproject.toml'
          Copy-Item lab_uv_env.toml $manifest
          uv pip install --dry-run --python .venv/Scripts/python.exe -r $manifest --extra runtime
      - run: uv pip check
      - run: uv run --no-sync python scripts/check_source_environment.py
      - run: uv run --no-sync python main.py --validate
      - run: uv run --no-sync python -m src --validate
      - run: uv run --no-sync python -m src.project_metadata
      - run: uv run --no-sync python -m unittest discover -s tests -p test_template_layout.py -v
      - run: uv run --no-sync python -m unittest discover -s tests -p test_project_metadata.py -v
      - run: python scripts/maintenance/build_release.py build/source-check
      - run: python build/source-check/main.py --validate
