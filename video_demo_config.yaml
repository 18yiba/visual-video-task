subject_id: DEMO001
session_id: 1
demo_mode: true

# Demo runs the same PsychoPy/marker timeline as the formal video paradigm but
# reads the ten numbered videos currently stored directly in video_library/.
device_type: brainco
hardware_dummy_mode: true
sfreq: 1000.0
buffer_sec: 180.0

protocol:
  fixation_sec: 1.5
  default_video_sec: 60.0
  blank_sec: 1.0
  iti_sec: 2.0
  eyes_open_baseline_sec: 60.0
  eyes_closed_baseline_sec: 60.0
  trials_per_session: 10
  video_library_dir: video_library
  video_library_mode: local
  playlist_mode: sequential
  random_seed: 17

device:
  neuracle_host: 127.0.0.1
  neuracle_port: 8712
  neuracle_eeg_channels: 64
  neuracle_include_trigger_channel: true
  brainco_addr: ''
  brainco_port: 0
  brainco_auto_discover: true
  brainco_scan_timeout_sec: 6.0
  brainco_ready_timeout_sec: 20.0
  brainco_start_retries: 2
  brainco_gain: 6
  brainco_signal_source: NORMAL
  brainco_device_id: bcigo
  brainco_transport: bcigo
  bcigo_marker_wait_timeout_sec: 60.0
  brainco_lsl_stream_name: ''
  brainco_lsl_stream_type: EEG
  brainco_lsl_source_id: ''
  brainco_lsl_resolve_timeout_sec: 15.0
  brainco_lsl_ready_timeout_sec: 10.0
  lsl_marker_enabled: true
  lsl_marker_stream_name: video-eeg-Markers
  lsl_marker_stream_type: Markers
  lsl_marker_source_id: video-eeg-marker
  trigger_serial_port: ''
  trigger_serial_timeout_sec: 1.5

storage:
  records_dir: video_demo_records_storage
