[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-eeg"
version = "0.1.0"
description = "Video neuro-response experiment with EEG acquisition and trigger alignment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "NCCLab" }
]
dependencies = [
  "psychopy",
  "bcigo-sdk>=1.0.2",
  "brainflow",
  "numpy",
  "pylsl",
  "psutil>=5.9",
  "pyserial",
  "pyyaml",
  "zeroconf",
]

[project.scripts]
video-eeg = "psychopy_video_experiment:main"
image-b-eeg = "psychopy_image_b_experiment:main"
image-b-rating = "psychopy_image_b_rating:main"

[tool.setuptools]
py-modules = ["psychopy_video_experiment", "psychopy_image_b_experiment", "psychopy_image_b_rating"]

[tool.setuptools.packages.find]
include = ["acquisition*", "collect*", "protocol*", "tasks*", "utils*"]
