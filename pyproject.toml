[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-eeg"
version = "0.1.0"
description = "PsychoPy video EEG paradigm with BrainCo SDK acquisition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "NCCLab" }
]
dependencies = [
  "psychopy",
  "bcigo-sdk>=1.0.2",
  "brainflow",
  "numpy",
  "pylsl",
  "psutil>=5.9",
  "pyserial",
  "pyyaml",
  "zeroconf",
]

[project.scripts]
video-eeg = "video_eeg.experiment.video_runner:main"

[tool.setuptools.packages.find]
include = ["video_eeg*"]