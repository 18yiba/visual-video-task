[project]
name = "video-eeg"
version = "0.3.7"
description = "Video EEG acquisition and emotion ratings; source-only project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "NCCLab" }
]
dependencies = []

[dependency-groups]
test = ["pytest>=8,<10"]
assets = ["dvc[s3]>=3,<4"]
# Candidate runtime requires dependency and real-window acceptance; see docs/deploy.md.
runtime = [
  "psychopy==2026.2.2; sys_platform == 'win32'",
  "bcigo-sdk==1.0.2; sys_platform == 'win32'",
  "brainflow==5.22.2; sys_platform == 'win32'",
  "numpy==2.3.5",
  "imageio-ffmpeg==0.6.0",
  "edfio==0.4.11",
  "pylsl==1.18.2",
  "psutil==7.2.2",
  "pyserial==3.5",
  "pyyaml==6.0.3",
  "zeroconf==0.150.0",
]
bids = ["bids-validator-deno==3.0.1", "deno==2.9.6", "edfio==0.4.11", "eeg-bids-converter"]

[tool.uv]
package = false

[tool.uv.sources]
eeg-bids-converter = { path = "vendor/eeg-bids-converter" }
