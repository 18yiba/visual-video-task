[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-eeg"
version = "0.1.0"
description = "PsychoPy video EEG paradigm with BrainCo SDK acquisition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "NCCLab" }
]
dependencies = [
  "psychopy",
  "bcigo-sdk>=1.0.2",
  "brainflow",
  "numpy",
  "imageio-ffmpeg>=0.6.0",
  "edfio==0.4.11",
  "pylsl",
  "psutil>=5.9",
  "pyserial",
  "pyyaml",
  "zeroconf",
]

[project.optional-dependencies]
bids = ["bids-validator-deno==3.0.1", "deno==2.9.6", "edfio==0.4.11"]

[project.scripts]
video-eeg = "video_eeg.experiment.video_runner:main"
acq-task = "video_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_eeg*"]

[tool.setuptools.package-data]
video_eeg = ["utils/*.json"]
